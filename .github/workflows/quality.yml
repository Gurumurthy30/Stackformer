name: Code Quality Pipeline

on:
  push:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Lint, Format, Types, Security
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ".[dev,train]"

      - name: Ruff Lint Check
        run: python -m ruff check src/ tests/

      - name: Ruff Formatting Check
        run: python -m ruff format --check src/ tests/

      - name: Pyright Type Check
        run: python -m pyright

      - name: Bandit Security Scan
        run: python -m bandit -r src/stackformer -ll -ii

      - name: Vulture Dead Code Analysis (Report Only)
        if: always()
        run: python -m vulture src/stackformer --min-confidence 80 || true

  audit:
    name: Dependency Vulnerability Audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ".[dev,train]" pip-audit

      - name: Run pip-audit
        run: python -m pip_audit
