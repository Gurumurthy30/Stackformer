      - GPT-1 & GPT-2: models/gpt.md
      - LLaMA-1 & LLaMA-2: models/llama.md
      - Gemma-1 (2B & 7B): models/gemma.md
      - BERT: models/bert.md
      - RoBERTa: models/roberta.md
      - Vaswani Transformer: models/transformer.md
      - Vision Transformer (ViT): models/vit.md
      - SegFormer: models/segformer.md
  - Training:
      - Training Overview: training/index.md
      - Trainer API: training/trainer.md
      - Engine Core: training/engine.md
      - Mixed Precision (AMP): training/mixed-precision.md
      - Distributed Training (DDP): training/distributed-training.md
      - Gradient Accumulation: training/gradient-accumulation.md
      - Optimizers & Schedulers: training/optimizers-and-schedulers.md
      - Checkpointing & SafeTensors: training/checkpointing.md
      - Logging & Metrics: training/logging.md
  - Generation:
      - Generation Overview: generation/index.md
      - Text Generation: generation/text-generation.md
      - KV-Cache Acceleration: generation/kv-cache.md
      - Prefill & Decode Interface: generation/prefill-and-decode.md
      - Sampling Strategies: generation/sampling-strategies.md
  - API Reference:
      - API Directory: api-reference/index.md
      - Configuration: api-reference/config.md
      - Modules & Layers: api-reference/modules.md
      - Models: api-reference/models.md
      - Training Engine: api-reference/engine.md
      - Text Generation: api-reference/generation.md
      - Key-Value Cache: api-reference/cache.md
      - Distributed Training: api-reference/distributed.md
      - Optimization & Losses: api-reference/optim.md
      - Logging & Metrics: api-reference/logging.md
      - Utilities: api-reference/utilities.md
  - Examples:
