      - Custom Transformer: examples/custom-transformer.md
      - Language Model Training: examples/language-model-training.md
      - Text Generation: examples/text-generation.md
      - Distributed DDP: examples/distributed-training.md
  - Developer Guide:
      - Developer Overview: developer-guide/index.md
      - Project Structure: developer-guide/project-structure.md
      - Architecture Deep Dive: developer-guide/architecture.md
      - Design Principles: developer-guide/design-principles.md
      - Testing: developer-guide/testing.md
      - Contributing: developer-guide/contributing.md
      - Technical Roadmap: developer-guide/roadmap.md
