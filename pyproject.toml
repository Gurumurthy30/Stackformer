[project]
name = "stackformer"
version = "0.1.10"
description = "Modular transformer blocks built in PyTorch"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE*", "THIRD_PARTY_NOTICES.md"]

authors = [
  { name = "Stackformer Labs", email = "stackformer.dev@gmail.com" }
]

keywords = ["transformer", "pytorch", "deep-learning", "attention", "llm", "machine-learning"]

dependencies = [
  "torch>=2.5,<3.0",
  "numpy>=1.24,<3.0",
  "safetensors>=0.4.0",
]

classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Typing :: Typed",
  "Operating System :: OS Independent",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Software Development :: Libraries :: Python Modules"
]

[project.optional-dependencies]
train = [
  "tqdm>=4.65.0",
  "rich>=12.0",
]
tensorboard = [
  "tensorboard>=2.14",
]
wandb = [
  "wandb>=0.17",
]
float8 = [
  "torchao>=0.6.0",
]
dev = [
  "pytest>=8.0,<9.0",
  "pytest-cov>=5.0,<6.0",
  "build>=1.2,<2.0",
  "twine>=5.0,<6.0",
]
all = [
  "tqdm>=4.65.0",
  "rich>=12.0",
  "tensorboard>=2.14",
  "wandb>=0.17",
  "torchao>=0.6.0",
  "pytest>=8.0,<9.0",
  "pytest-cov>=5.0,<6.0",
  "build>=1.2,<2.0",
  "twine>=5.0,<6.0",
]

[project.urls]
Repository = "https://github.com/stackformer-labs/Stackformer"
Releases = "https://github.com/stackformer-labs/Stackformer/releases"
Issue-Tracker = "https://github.com/stackformer-labs/Stackformer/issues"
Discussions = "https://github.com/stackformer-labs/Stackformer/discussions"
Documentation = "https://github.com/stackformer-labs/Stackformer/tree/main/docs"

[tool.setuptools.packages.find]
where = ["src"]
include = ["stackformer*"]
exclude = ["assets*"]

[tool.setuptools.package-data]
stackformer = ["py.typed"]

[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["."]
markers = [
  "gpu: tests that require CUDA-capable GPU hardware",
]
